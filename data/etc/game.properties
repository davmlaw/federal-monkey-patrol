#preference file....
mission.dir=data/missions
lives=3

# the patrol area: a circle of this radius (world units) round the start
# (a block is 400). The kongs keep inside it; fly out and you get
# turn_back_seconds to come back before losing a plane.
patrol_radius=3200
turn_back_seconds=6

# the throttle's range, world units per second (a block is 400). The plane
# never flies slower than min_speed, even with the throttle closed.
min_speed=200
max_speed=1000
