#preference file....
mission.dir=data/missions
lives=3

# the patrol area: a circle of this radius (world units) round the start
# (a block is 400). The kongs keep inside it; fly out and you get
# turn_back_seconds to come back before losing a plane.
patrol_radius=3200
turn_back_seconds=6

# the throttle's range, world units per second (a block is 400), going by
# height above the street: *_low at speed_low_height and below, *_high at
# speed_high_height and above, in proportion in between. The plane never
# flies slower than the min, even with the throttle closed.
speed_low_height=100
speed_high_height=2500
min_speed_low=80
min_speed_high=600
max_speed_low=600
max_speed_high=1500

# top-down missions (no throttle: they cruise halfway, up/down on the stick
# goes from the min to the max)
topdown_min_speed=200
topdown_max_speed=600

# with no patrol area (<patrolradius>none</patrolradius>, Monkey Mayhem),
# the kongs keep within this radius of a point a little ahead of the plane
roam_radius=2500
