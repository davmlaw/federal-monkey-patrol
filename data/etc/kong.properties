# The kongs: giant apes that walk the streets, climb buildings and can be
# shot down (src/mission/kongs.ts). A mission can set how many with
# <kongs>N</kongs> in its <startconditions>.
model=kong2.obj
skin=kongcolor.jpg
# how many roam the city at once
count=4
# height to the top of the raised hands, in world units (a storey is 18)
height=90
# world units per second
walk_speed=35
climb_speed=45
# chance of climbing a building at each crossing, 0 to 1
climb_chance=0.35
# the tallest roof they will climb
climb_max=900
# bullet hits before one falls: a random whole number in this range (a bomb counts 4)
health_min=5
health_max=10
# milliseconds after one falls before another comes
respawn_msecs=8000
