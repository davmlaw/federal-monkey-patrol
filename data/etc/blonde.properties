# Blondes (src/mission/blonde.ts): kongs reach in at windows and carry them
# up the skyscrapers; shoot the kong and she floats down for the plane to
# catch. Not in the rooftop modes (those kongs never climb).
model=blonde.obj
skin=blondecolor2.jpg
# her height, world units (a kong is 90, a storey 18)
height=15
# chance a kong's climb is a kidnapping (it reaches in at a window on the
# way up and goes on to the top)
grab_chance=0.6
# no more kidnappings while this many are carried or falling
max_blondes=3
# kidnappers climb buildings at least this tall, to the top of the tower
min_top=300
# climbing one-handed, world units per second (kong.properties climb_speed
# otherwise)
carry_climb_speed=28
# a kong carrying one climbs at a crossing with this chance (instead of
# kong.properties climb_chance)
carry_climb_chance=0.6
# with blondes about, this share of kongs come (and come back) already
# halfway up a skyscraper, climbing on up it (reaching in at a window there
# for a blonde, by grab_chance, if there's one to be had)
spawn_climbing=0.3
# ...on buildings at least this tall (to the top of the tower); with none
# at the crossing, it starts in the street
spawn_climbing_top=700
# how long a kidnapper stays up on the roof, roaring, before climbing down
# with her (and later climbing another)
roof_seconds_min=20
roof_seconds_max=40
# falling: her dress catches the air, so she comes down this slowly
# (world units per second)
fall_speed=22
# the plane catches her within this distance of her waist
catch_radius=30
# landed: she sits there dazed this long, then she's gone
landed_seconds=10
